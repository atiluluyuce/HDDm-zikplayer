# ALSA yapılandırması — PCM5102A I2S DAC.
#
# PCM5102A'nın donanımsal ses seviyesi kaydı yoktur; yonga her zaman tam çıkış
# verir. Arayüzden ses ayarlayabilmek için ALSA'nın softvol eklentisi araya
# giriyor. Bit-perfect çıkış isteyenler hddmusicplayer.env içinde
# HDDMUSICPLAYER_VOLUME_MODE=fixed yapıp install.sh'ı VOLUME_MODE=fixed ile tekrar
# çalıştırabilir; o durumda bu katman devre dışı kalır.
#
# Kart adı "sndrpihifiberry", hifiberry-dac overlay'i tarafından oluşturulur.
# Kart numarası yerine adla eşleşmek, USB ses aygıtı takıldığında numaraların
# kayması sorununu ortadan kaldırır.

pcm.hddmusicplayer {
    type            softvol
    slave.pcm       "hw:CARD=sndrpihifiberry,DEV=0"
    control {
        name        "SoftMaster"
        card        "sndrpihifiberry"
    }
    max_dB          0.0
    min_dB          -51.0
    resolution      100
}

# Sistem genelinde varsayılan çıkış (aplay, speaker-test vb. için).
pcm.!default {
    type            plug
    slave.pcm       "hddmusicplayer"
}

ctl.!default {
    type            hw
    card            "sndrpihifiberry"
}
