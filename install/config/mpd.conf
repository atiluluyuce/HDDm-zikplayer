# hddmusicplayer için MPD yapılandırması.
# install.sh tarafından üretilir — elle düzenlemek yerine kurulumu tekrar çalıştır.

music_directory     "@MUSIC_ROOT@"
playlist_directory  "/var/lib/mpd/playlists"
db_file             "/var/lib/mpd/tag_cache"
state_file          "/var/lib/mpd/state"
sticker_file        "/var/lib/mpd/sticker.sql"
# pid_file systemd altında yok sayılıyor, bilerek yazılmıyor.
log_file            "syslog"

user                "mpd"
bind_to_address     "127.0.0.1"
port                "6600"

# Kütüphane taramasını hddmusicplayer yönetiyor; MPD'nin ayrıca dosya sistemini
# izlemesi USB diskte gereksiz uyanmalara yol açar.
auto_update         "no"
zeroconf_enabled    "no"

# Etiket tarafı: kapak görsellerini hddmusicplayer çıkarıp önbelleğe aldığı için
# MPD'nin ayrıca resim okumasına gerek yok.
metadata_to_use     "artist,albumartist,album,title,track,disc,genre,date"

audio_output {
    type            "alsa"
    name            "PCM5102A I2S DAC"
    device          "@MPD_DEVICE@"
    @MPD_MIXER@

    # Örnekleme hızını MPD'ye dönüştürtme: dosya neyse DAC'a o gitsin.
    # PCM5102A 44.1/48/88.2/96/176.4/192 kHz'i doğrudan kabul eder.
    auto_resample   "no"
    auto_format     "no"
    auto_channels   "no"
}

# Albüm bazlı ses eşitleme. Etiketlerde ReplayGain bilgisi yoksa etkisizdir,
# varsa albümler arası seviye farkını giderir.
replaygain          "album"
replaygain_preamp   "0"

# Pi 3'te USB diskten okurken tamponun biraz geniş olması, disk uyanırken
# oluşan gecikmelerde sesin kesilmesini engelliyor.
audio_buffer_size   "8192"
